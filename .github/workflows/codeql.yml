# VV — CodeQL (SAST). Tiefen-Sicherheitsanalyse zusätzlich zu den ADR-Validatoren.
# Läuft bei Push/PR und wöchentlich. Findet Klassen von Schwachstellen (Injection, unsichere
# Deserialisierung, Path-Traversal etc.), die die ADR-Validatoren nicht abdecken.
name: codeql
on:
  push:
    branches: [ master, main, "stage-*", "feat/**" ]   # R6/H-14: realer Hauptbranch `master`
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # wöchentlich Montag 03:00 UTC
jobs:
  analyze:
    name: CodeQL Analyse
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [ "javascript-typescript", "python" ]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: CodeQL initialisieren
        uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - name: Analyse
        uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          category: "/language:${{ matrix.language }}"
