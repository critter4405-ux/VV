# VV — CodeQL (SAST). Tiefen-Sicherheitsanalyse zusätzlich zu den ADR-Validatoren.
# Läuft bei Push/PR und wöchentlich. Findet Klassen von Schwachstellen (Injection, unsichere
# Deserialisierung, Path-Traversal etc.), die die ADR-Validatoren nicht abdecken.
name: codeql
on:
  push:
    branches: [ master, main, "stage-*", "feat/**" ]   # R6/H-14: realer Hauptbranch `master`
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # wöchentlich Montag 03:00 UTC
jobs:
  analyze:
    name: CodeQL Analyse
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [ "javascript-typescript", "python" ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CodeQL initialisieren
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - name: Analyse
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"
