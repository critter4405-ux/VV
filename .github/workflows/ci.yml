# VV CI — Stage 0 + Modul M05 + C-1 Kontext-Signatur (Ticket-Dienst). Build + Validatoren gate-blockierend. NUR synthetische Daten (ADR-10).
# Supply-Chain: alle GitHub-Actions auf Commit-SHA gepinnt (Versions-Tag als Kommentar),
# Dependabot (github-actions + docker) hält die SHAs/Digests aktuell. Container-Images werden
# per scripts/pin-images.sh auf @sha256-Digest gepinnt (in einer Umgebung mit Registry-Zugang
# ausführen; die Sandbox-Egress-Policy sperrt Docker Hub/quay.io) — bis dahin fixe Tags, kein :latest.
name: vv-ci

on:
  push:
    # R6/H-14 (M05-Reparaturrunde 1): realer Hauptbranch ist `master` — beide Namen abgedeckt,
    # Selbsttest (validators/selftest.py) erzwingt das. Ruleset/Required Checks: TODO bei Remote-Anlage.
    branches: [ master, main, "stage-*", "feat/**" ]
  pull_request:

jobs:
  validators:
    name: ADR-Validatoren statisch (Gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Kein .env committet?
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then echo "::error::.env committet"; exit 1; fi
          echo "OK"
      - run: python -m pip install -r validators/requirements.txt
      - run: python -m validators.validate
      - name: Validator-Selbsttest (Sicherheits-Regressionsschutz)
        run: python -m validators.selftest   # bekannte Umgehungen müssen ROT bleiben
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: validator-report, path: evidence/stage-0/validator-report.json }

  db-integration:
    name: "Live-DB: Migrationen + RLS gegen echte PostgreSQL (Gate)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vv_bootstrap
          POSTGRES_PASSWORD: change_me_dev_only
          POSTGRES_DB: vv
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U vv_bootstrap -d vv" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: change_me_dev_only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: python -m pip install -r validators/requirements.txt
      - name: Migrationen + Seed einspielen (Bootstrap-Superuser)
        run: |
          for f in db/migrations/*.sql db/seed/*.sql; do
            echo "-> $f"; psql -v ON_ERROR_STOP=1 -h localhost -U vv_bootstrap -d vv -f "$f"
          done
          # Passwörter sicher quotiert setzen (kein String-Interpolation, Codex #7-new).
          # :'var' interpoliert nur über stdin/-f, nicht über -c; \gexec ohne ';' (sonst No-Op).
          for r in vv_app vv_worker; do
            printf "SELECT format('ALTER ROLE %%I PASSWORD %%L', :'role', :'pw')\n\\gexec\n" | \
              psql -v ON_ERROR_STOP=1 -h localhost -U vv_bootstrap -d vv \
                -v role="$r" -v pw="change_me_dev_only" -f -
          done
      - name: "C-1: Wegwerf-Ticket-Schlüssel für diesen Lauf (Betreiber-Skript, DB + Keyring)"
        env:
          PGHOST: localhost
          PGUSER: vv_bootstrap
          PGPASSWORD: change_me_dev_only
          KEYRING_FILE: ${{ runner.temp }}/ticket_keyring.json
        run: |
          bash scripts/rotate_ticket_key.sh init
          echo "VV_TICKET_KEYRING=$KEYRING_FILE" >> "$GITHUB_ENV"
      - name: Validatoren im LIVE-Modus (gate-blockierend, Live PFLICHT)
        env:
          VV_VALIDATE_DSN: "host=localhost dbname=vv user=vv_app password=change_me_dev_only"
          VV_REQUIRE_LIVE: "1"   # ohne echte DB im Gate -> FAIL, nie stiller PASS (Codex #5-new)
        run: python -m validators.validate
      - name: "RLS/C-1-Gegenprobe als vv_app (ohne Ticket: kein Tabellenrecht, keine Daten)"
        run: |
          O=$(PGPASSWORD=change_me_dev_only psql -tA -h localhost -U vv_app -d vv -c "SELECT count(*) FROM person" 2>&1 || true)
          echo "$O"; echo "$O" | grep -q "permission denied"
          O=$(PGPASSWORD=change_me_dev_only psql -tA -h localhost -U vv_app -d vv -c "SELECT count(*) FROM basis01_list_persons()" 2>&1 || true)
          echo "$O"; echo "$O" | grep -q "deny-by-default"
      - name: Sicherheits-DB-Gegenproben (RLS, Outbox, approved_by/SoD, DLQ-Reaper, M05) — gate-blockierend
        env:
          VV_PGHOST: localhost
          PW: change_me_dev_only
        run: bash scripts/ci_db_asserts.sh   # ruft scripts/m05_db_asserts.py (M05/BASIS-02, adversarial) auf
      - name: "C-1 Kontext-Signatur: DB-Gegenproben DoD 1–7 (inkl. echtem Schlüsselwechsel) — gate-blockierend"
        env:
          VV_PGHOST: localhost
          PW: change_me_dev_only
        run: python3 scripts/c1_db_asserts.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22" }
      - name: M05-API-Integrationstest gegen echte PostgreSQL (vv_app, RLS aktiv)
        working-directory: apps/web
        env:
          DATABASE_URL: "postgres://vv_app:change_me_dev_only@localhost:5432/vv"
          VV_BOOTSTRAP_URL: "postgres://vv_bootstrap:change_me_dev_only@localhost:5432/vv"   # nur Testdaten-Anlage
          VV_REQUIRE_DB: "1"   # ohne DB -> Fehler, nie stiller Skip
        run: |
          npm ci
          npm test
      - name: M05-Worker-Integrationstest (Freigabe -> Outbox -> Worker -> Wirkung, genau einmal)
        working-directory: apps/worker
        env:
          DATABASE_URL: "postgres://vv_app:change_me_dev_only@localhost:5432/vv"
          WORKER_DATABASE_URL: "postgres://vv_worker:change_me_dev_only@localhost:5432/vv"
          VV_BOOTSTRAP_URL: "postgres://vv_bootstrap:change_me_dev_only@localhost:5432/vv"
          VV_REQUIRE_DB: "1"
        run: |
          npm ci
          npm test
      - name: Worker-Start-Probe (echter Start mit vv_worker, pg-boss-Schema, Tageszeitplan) — gate-blockierend
        env:
          VV_PGHOST: localhost
          PW: change_me_dev_only
        run: bash scripts/worker_smoke.sh   # P57: realer Start scheiterte bisher unbemerkt
      - name: "C-1 Ende-zu-Ende: Token -> Ticket-Dienst -> Web -> DB, fail-closed bei Dienstausfall — gate-blockierend"
        env:
          VV_PGHOST: localhost
          PW: change_me_dev_only
        run: |
          (cd apps/ticket && npm ci)
          bash scripts/c1_e2e.sh

  typecheck-web:
    name: Typecheck Web/API
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run typecheck
      - name: Unit-Tests Web (Policy-Prüfpunkt, M05-Validierung)
        run: npm test

  typecheck-worker:
    name: Typecheck + Vier-Augen-Test Worker
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/worker } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run typecheck
      - name: Vier-Augen-Adversarial-Test (Sicherheit)
        run: npm test   # spoof/forge/replay/expiry der Freigabe müssen ROT sein

  typecheck-ticket:
    name: Typecheck + Tests Ticket-Dienst (C-1)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/ticket } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run typecheck
      - name: Adversarial-Tests (Token-Fälschung, alg-Tausch, ID-Token, Rate-Limit, keine Tokens im Log)
        run: npm test

  dep-audit:
    name: Dependency-Audit (npm) — high/critical blockierend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, worker, ticket]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22" }
      - name: npm audit (Produktions-Abhängigkeiten)
        run: npm audit --omit=dev --audit-level=high

  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cp .env.example .env && docker compose config > /dev/null && echo OK

  mermaid-lint:
    name: Mermaid echter Parser (mmdc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22" }
      - name: Mermaid-Blöcke extrahieren
        run: python scripts/mermaid_lint.py
      - name: Jede .mmd mit echtem Parser rendern (Syntaxfehler = Fehlschlag)
        run: |
          shopt -s nullglob
          files=(build/mermaid/*.mmd)
          if [ ${#files[@]} -eq 0 ]; then echo "keine Diagramme"; exit 0; fi
          for f in "${files[@]}"; do
            echo "-> $f"
            npx -y @mermaid-js/mermaid-cli@11 -i "$f" -o "${f%.mmd}.svg" -p scripts/puppeteer-config.json -q || { echo "::error::Mermaid-Syntaxfehler in $f"; exit 1; }
          done
          echo "Alle Diagramme syntaktisch valide."

  secret-scan:
    name: Secret-Scan (gitleaks)
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # Authentifizierte Kontotyp-Abfrage (persönliches Konto = keine Lizenz nötig). Ohne Token lief
          # die Abfrage ins API-Rate-Limit und die Action verlangte fälschlich eine Lizenz (CI rot, kein Fund).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
