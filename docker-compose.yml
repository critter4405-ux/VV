# VV — lokaler Stack (Stage 0, ADR-10). Prod nur AT. Dev/CI = synthetische Daten.
# WP1: Bootstrap-Superuser != App-Rolle; Migrationen via init-Wrapper (kein Unterverzeichnis-Mount).

name: vv

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vv_bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-vv}
      VV_APP_PASSWORD: ${VV_APP_PASSWORD:-change_me_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Migrationen/Seed liegen unter /db; der Wrapper spielt sie sortiert + fail-fast ein.
      - ./db:/db:ro
      - ./db/init/00_init.sh:/docker-entrypoint-initdb.d/00_init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vv_bootstrap} -d ${POSTGRES_DB:-vv}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change_me_dev_only}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
      - "9000:9000"   # Management-Port (Health /health/ready)
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # Semantische Readiness statt reinem TCP-Socket (Review-Befund Codex #11).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && cat <&3 | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vv_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_dev_only}
    ports:
      - "9002:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ./apps/web
    # Least-Privilege (Review Codex #10): Web bekommt NUR seine Secrets — kein Keycloak-Admin,
    # kein MinIO-Root, kein Postgres-Bootstrap-Passwort.
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ./apps/worker
    # Eigene technische Identität (vv-worker), keine Web-/Admin-/Root-Secrets.
    environment:
      DATABASE_URL: ${DATABASE_URL}
      WORKER_OIDC_CLIENT_ID: ${WORKER_OIDC_CLIENT_ID}
      WORKER_OIDC_CLIENT_SECRET: ${WORKER_OIDC_CLIENT_SECRET}
      MODEL_PROVIDER: ${MODEL_PROVIDER}
      MODEL_API_BASE: ${MODEL_API_BASE}
      MODEL_API_KEY: ${MODEL_API_KEY}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY}
    depends_on:
      postgres:
        condition: service_healthy
    # Heartbeat-Healthcheck (WP4/Review #11): Worker schreibt eine Datei je Tick.
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/vv-worker-alive && find /tmp/vv-worker-alive -mmin -1 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  miniodata:
